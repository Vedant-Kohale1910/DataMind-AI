<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>DataMind AI</title>
<link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="./assets/favicon-16.png">
<link rel="icon" type="image/png" sizes="48x48" href="./assets/favicon-48.png">
<link rel="apple-touch-icon" sizes="180x180" href="./assets/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/style.css" />
</head>
<body>

  <!-- ================= THEME TOGGLE (always visible, top corner) ================= -->
  <div class="theme-toggle" id="themeToggle" title="Toggle dark / light mode">
    <input type="checkbox" id="themeSwitch" />
    <label for="themeSwitch">
      <span class="icon icon-sun">&#9728;</span>
      <span class="icon icon-moon">&#9790;</span>
    </label>
  </div>

  <!-- ================= STAGE 1 : LANDING / STAGING PAGE ================= -->
  <main class="stage" id="stagePage">
    <div class="stage__glow"></div>

    <!-- Icon Sphere with heading/subheading overlaid on top -->
    <div class="hero-sphere" id="sphereWrap">
      <div class="sphere-stage" id="sphereStage"></div>
      <div class="hero-text">
        <div class="hero-heading">
          <div class="brand-logo" aria-hidden="true"></div>
          <h1 class="stage__title">DataMind AI</h1>
        </div>
        <p class="stage__subtitle">Your AI assistant for your Machine Learning and Data Science queries</p>
      </div>
    </div>

    <button class="start-btn" id="startChatBtn">
      <span>Start Chatting</span>
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
    </button>
  </main>

  <!-- ================= STAGE 2 : CHAT OVERLAY ================= -->
  <div class="chat-backdrop" id="chatBackdrop"></div>

  <section class="chat-panel" id="chatPanel" aria-hidden="true">
    <header class="chat-panel__header">
      <div class="chat-panel__identity">
        <div class="chat-avatar">
          <span class="logo-icon" aria-hidden="true"></span>
        </div>
        <div>
          <p class="chat-panel__name">Assistant</p>
          <p class="chat-panel__status"><span class="status-dot"></span> online</p>
        </div>
      </div>

      <div class="chat-panel__actions">
        <button class="icon-btn" id="clearChatBtn" title="Clear conversation">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
        </button>
        <button class="icon-btn" id="closeChatBtn" title="Close chat">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
        </button>
      </div>
    </header>

    <div class="chat-panel__body" id="chatBody">
      <!-- messages injected here -->
    </div>

    <form class="chat-panel__footer" id="chatForm" autocomplete="off">
      <div class="finder" id="finder">
        <div class="finder__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2a8 8 0 1 0 5.29 14.71l4.5 4.5"/></svg>
        </div>
        <input type="text" class="finder__input" id="chatInput" placeholder="Ask about your documents…" />
        <button type="submit" class="finder__send" id="sendBtn" title="Send">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
        </button>
      </div>
    </form>
  </section>

  <!-- typing indicator template (cloned via JS) -->
  <template id="typingTemplate">
    <div class="msg msg--bot msg--typing">
      <div class="msg__avatar bot-avatar">
        <span class="logo-icon" aria-hidden="true"></span>
      </div>
      <div class="msg__bubble msg__bubble--typing">
        <span class="wave-dot"></span>
        <span class="wave-dot"></span>
        <span class="wave-dot"></span>
      </div>
    </div>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
  <script src="./js/script.js"></script>
</body>
</html>
